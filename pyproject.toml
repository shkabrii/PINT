[project]
name = "pint-unlearning"
version = "0.1.0"
description = "PINT: LLM unlearning via statistical independence, built on OpenUnlearning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"

# The environment the experiments ran in (torch 2.5.1+cu121, lm-eval 0.4.8).
dependencies = [
    "torch==2.5.1",
    "transformers==4.51.3",
    "tokenizers==0.21.4",
    "accelerate==0.34.2",
    "deepspeed==0.15.4",
    "datasets==3.0.1",
    "peft==0.20.0",
    "numpy==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "huggingface-hub==0.36.0",
    "hf-xet==1.2.0",
    "hydra-core==1.3.0",
    "hydra_colorlog==1.2.0",
    "omegaconf==2.3.1",
    "bitsandbytes==0.44.1",
    "rouge-score==0.1.2",
    "tensorboard==2.18.0",
    "wandb==0.21.4",
    "lm-eval==0.4.8",
]

[project.optional-dependencies]
dev = ["pre-commit==4.0.1", "ruff==0.6.9"]

[tool.uv]
package = false
# Linux only: torch+cu121 has no macOS wheel.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
