# @package _global_
defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: finetune
  - override /data/datasets@data.train: BIOS_full
  - override /eval: bios

mode: finetune
bios_seed: 0

model:
  model_args:
    attn_implementation: sdpa

trainer:
  args:
    learning_rate: 1e-5
    weight_decay: 0.01
    warmup_epochs: 1.0
    num_train_epochs: 10
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 1

task_name: bios/full_s${bios_seed}
