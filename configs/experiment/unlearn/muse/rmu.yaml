# @package _global_
# RMU on MUSE (protocol of muse/pint.yaml, CAIS scope); tuned: steering_coeff, alpha, learning rate.
defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: RMU
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null
rmu_layer: 7

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target
    attn_implementation: sdpa
  tokenizer_args:
    pretrained_model_name_or_path: NousResearch/Llama-2-7b-hf

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  method_args:
    steering_coeff: 10
    alpha: 1
    gamma: 1.0
    retain_loss_type: EMBED_DIFF
    module_regex: model\.layers\.${rmu_layer}
    trainable_params_regex:
      - model\.layers\.(5|6|7)\.mlp\.down_proj\.weight
  args:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    learning_rate: 5e-5
    num_train_epochs: 10
    lr_scheduler_type: constant
    gradient_checkpointing: true
    seed: 1

task_name: muse/rmu/${data_split}_c${trainer.method_args.steering_coeff}_a${trainer.method_args.alpha}_lr${trainer.args.learning_rate}_s${trainer.args.seed}
