# @package _global_
# PINT on bioS (1 GPU, batch 32, 10 epochs); needs the fine-tuned model from finetune/bios/default.
defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: PINT
  - override /data: unlearn
  - override /data/datasets@data.forget: BIOS_forget
  - override /data/datasets@data.retain: BIOS_retain
  - override /eval: bios

bios_seed: 0
bios_model: saves/finetune/bios/full_s${bios_seed}

model:
  model_args:
    pretrained_model_name_or_path: ${bios_model}
    attn_implementation: sdpa
  tokenizer_args:
    pretrained_model_name_or_path: ${bios_model}

data:
  anchor: forget

trainer:
  method_args:
    lambda: 3
  args:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 1
    learning_rate: 1e-5
    num_train_epochs: 10
    warmup_epochs: 0
    weight_decay: 0.0
    seed: 1

task_name: bios/pint/s${bios_seed}_l${trainer.method_args.lambda}_lr${trainer.args.learning_rate}_s${trainer.args.seed}
