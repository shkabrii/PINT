# @package _global_
# PINT on the Gaussian poisons: OLMo-2 2.7B, 4096-token sequences, 4 GPUs, checkpoint every 25 steps.
defaults:
  - override /model: OLMo-2-2.7B-Exp
  - override /trainer: PINT
  - override /data: unlearn
  - override /data/datasets@data.forget: GW_forget
  - override /data/datasets@data.retain: GW_retain
  - override /eval: olmo_gw

data:
  anchor: forget

trainer:
  method_args:
    lambda: 100
    trainable_params_regex:
      - model\.embed_tokens\.weight
      - model\.layers\..*
      - model\.norm\.weight
  args:
    learning_rate: 3e-5
    max_steps: 200
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    gradient_checkpointing: true
    gradient_checkpointing_kwargs:
      use_reentrant: false
    save_strategy: steps
    save_steps: 25
    eval_strategy: "no"
    seed: 0

task_name: olmo_gw/pint/l${trainer.method_args.lambda}_lr${trainer.args.learning_rate}_s${trainer.args.seed}
