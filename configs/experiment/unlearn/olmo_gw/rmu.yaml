# @package _global_
# RMU on the Gaussian poisons (protocol of olmo_gw/pint.yaml); tuned: steering_coeff, learning rate.
defaults:
  - override /model: OLMo-2-2.7B-Exp
  - override /trainer: RMU
  - override /data: unlearn
  - override /data/datasets@data.forget: GW_forget
  - override /data/datasets@data.retain: GW_retain
  - override /eval: olmo_gw

rmu_layer: 7

data:
  anchor: forget

trainer:
  method_args:
    steering_coeff: 10
    alpha: 1
    gamma: 1.0
    retain_loss_type: EMBED_DIFF
    module_regex: model\.layers\.${rmu_layer}
    trainable_params_regex:
      - model\.embed_tokens\.weight
      - model\.layers\..*
      - model\.norm\.weight
  args:
    learning_rate: 3e-5
    max_steps: 200
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    gradient_checkpointing: true
    gradient_checkpointing_kwargs:
      use_reentrant: false
    save_strategy: steps
    save_steps: 25
    eval_strategy: "no"
    seed: 0

task_name: olmo_gw/rmu/c${trainer.method_args.steering_coeff}_lr${trainer.args.learning_rate}_s${trainer.args.seed}
