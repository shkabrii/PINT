# @package _global_
# GradAscent on the Gaussian poisons (protocol of olmo_gw/pint.yaml); tuned: learning rate.
defaults:
  - override /model: OLMo-2-2.7B-Exp
  - override /trainer: GradAscent
  - override /data: unlearn
  - override /data/datasets@data.forget: GW_forget
  - override /data/datasets@data.retain: GW_retain
  - override /eval: olmo_gw

data:
  anchor: forget

trainer:
  args:
    learning_rate: 7e-6
    max_steps: 200
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    gradient_checkpointing: true
    gradient_checkpointing_kwargs:
      use_reentrant: false
    save_strategy: steps
    save_steps: 25
    eval_strategy: "no"
    seed: 0

task_name: olmo_gw/gradascent/ga_lr${trainer.args.learning_rate}_s${trainer.args.seed}
