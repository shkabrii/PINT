# @package _global_
# NPO on TOFU (protocol of tofu/pint.yaml); tuned: beta, alpha, learning rate.
defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: NPO
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full
    attn_implementation: sdpa
  tokenizer_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

forget_split: forget01
retain_split: retain99
holdout_split: holdout01
retain_logs_path: null
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  method_args:
    beta: 0.5
    alpha: 5
    gamma: 1.0
    retain_loss_type: NLL
  args:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 1
    learning_rate: 1e-5
    num_train_epochs: 10
    warmup_epochs: 0
    weight_decay: 0.0
    seed: 1

task_name: tofu/npo/${forget_split}_b${trainer.method_args.beta}_a${trainer.method_args.alpha}_lr${trainer.args.learning_rate}_s${trainer.args.seed}
